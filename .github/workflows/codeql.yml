name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly, independent of any push — catches new CodeQL query-pack
    # findings against code that hasn't changed.
    - cron: '30 4 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      # Explicit build instead of the default autobuild — this repo's
      # build is a single known command (see package.json), no need for
      # CodeQL's build-step heuristics to guess it.
      - run: npm run build --if-present

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
