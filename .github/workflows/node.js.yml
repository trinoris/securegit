# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Nightly chaos-sandbox run — see the `chaos` job below for why this
    # stays off the push/PR path.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm audit --audit-level=high
    - run: npm run build --if-present
    - run: npm test

  # Runs the Docker Compose chaos sandbox (chaos/docker-compose.yml, see
  # specs/chaotests/01-sandbox.md) once per git workflow this project
  # models (specs/chaotests/03-orchestrator.md): direct-master (W1, no
  # gate at all), working-branch (W2, gated only at the promotion to
  # master), pr-gated (W3, every change reviewed before master ever
  # moves). Each is its own matrix leg, `fail-fast: false` — W1 and W2 are
  # *expected* to sometimes fail their own "hard invariant violated" check
  # below (that's the whole comparison this exists to make), and one
  # mode's expected red must never cancel the others mid-run. `chaos-
  # publish` (below) assembles all three legs' results into one Pages
  # site regardless of which legs failed.
  #
  # Deliberately nightly + manual only, never on push/PR: this is a several-
  # minute, fuzzing-campaign-style run ("reported, not scored" per
  # specs/chaotests/01-sandbox.md), not a fast deterministic gate, and it's
  # new enough (two real bugs found and fixed in the sandbox itself the
  # first time it was actually run) that it shouldn't block merges yet.
  chaos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workflow: [direct-master, working-branch, pr-gated]
    env:
      CHAOS_DURATION_SECONDS: 180
      VERIFIER_STARTUP_GRACE_SECONDS: 20
      VERIFIER_SETTLE_SECONDS: 60
      SANDBOX_WORKFLOW: ${{ matrix.workflow }}
    steps:
      - uses: actions/checkout@v7

      - name: Run the chaos sandbox (${{ matrix.workflow }})
        run: |
          docker compose -f chaos/docker-compose.yml up --build -d
          # `wait` exits with verifier's own exit code — a hard-invariant
          # violation (or any other reason verifier itself exits nonzero)
          # must NOT abort this step under -e, or every step below that's
          # `if: always()` for exactly this reason (publish a failing run,
          # not just a passing one) never gets anything to publish, and the
          # underlying failure's own report/logs are lost for good once the
          # runner tears down. The actual pass/fail signal comes from
          # verifier-result.json itself, in the last step below.
          docker compose -f chaos/docker-compose.yml wait verifier || true

      - name: Extract the run's report and audit
        if: always()
        run: |
          mkdir -p site
          docker compose -f chaos/docker-compose.yml logs verifier > verifier.log || true
          docker compose -f chaos/docker-compose.yml run --rm --no-deps verifier cat /report/report.jsonl > site/report.jsonl || true
          docker compose -f chaos/docker-compose.yml run --rm --no-deps verifier cat /report/verifier-result.json > site/verifier-result.json || true

      - name: Tear down
        if: always()
        run: docker compose -f chaos/docker-compose.yml down -v

      # Always publish, pass or fail — a violation is exactly the
      # interesting result this exists to surface, not one to hide.
      # A plain (non-Pages) artifact per leg — `chaos-publish` assembles
      # all three into the one site actually deployed.
      - name: Upload this workflow's raw run artifacts (report, audit, logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-result-${{ matrix.workflow }}-${{ github.run_id }}
          path: |
            site/report.jsonl
            site/verifier-result.json
            verifier.log

      # Last step, deliberately: publishing above must happen regardless
      # of outcome. Failing here just makes a violated run show red on the
      # schedule/dispatch history, for *this leg only* (`fail-fast: false`
      # keeps the other two workflows running and publishing regardless)
      # — see the job comment for why this can never affect a push/PR
      # run's status, and specs/chaotests/03-orchestrator.md's "Predicted
      # plaintext-leak shape" table for which legs are expected to fail.
      - name: Fail if a hard invariant was violated
        if: always()
        run: |
          if [ ! -s site/verifier-result.json ]; then
            echo "::error::verifier-result.json is missing or empty — the sandbox run itself failed before producing a result (see the 'Run the chaos sandbox' step and verifier.log in the uploaded artifact, if any)."
            exit 1
          fi
          held=$(jq -r '.hardInvariantsHeld' site/verifier-result.json)
          echo "hardInvariantsHeld=$held"
          if [ "$held" != "true" ]; then
            echo "::error::A hard invariant was violated this run (workflow=${{ matrix.workflow }}) — see the deployed viewer or verifier.log."
            exit 1
          fi

  # Assembles all three matrix legs' results into one site and publishes
  # it — `if: always()` because W1/W2 failing their own invariant check
  # above is the expected, interesting result this whole comparison
  # exists to surface, never a reason to skip publishing it.
  chaos-publish:
    needs: chaos
    if: always() && needs.chaos.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Download every workflow's results
        uses: actions/download-artifact@v8
        with:
          pattern: chaos-result-*-${{ github.run_id }}
          path: downloaded

      - name: Assemble the comparison site
        run: |
          mkdir -p site
          cp chaos/viewer/index.html site/index.html
          for workflow in direct-master working-branch pr-gated; do
            mkdir -p "site/$workflow"
            src="downloaded/chaos-result-$workflow-${{ github.run_id }}"
            if [ -d "$src" ]; then
              # The uploading step (matrix leg's "Upload this workflow's raw
              # run artifacts") lists `site/report.jsonl` and
              # `site/verifier-result.json` alongside a *sibling*
              # `verifier.log` (not under `site/`) — upload-artifact takes
              # the common ancestor of all listed paths as the archive
              # root, which is the workspace root here (verifier.log isn't
              # under site/), so the downloaded artifact keeps the `site/`
              # prefix rather than flattening it away. Confirmed by a real
              # run (33955584166) where this cp silently found nothing
              # (redirected to /dev/null) and every mode's page loaded an
              # empty comparison.
              cp "$src"/site/report.jsonl "site/$workflow/report.jsonl" 2>/dev/null || true
              cp "$src"/site/verifier-result.json "site/$workflow/verifier-result.json" 2>/dev/null || true
            else
              echo "::warning::no results downloaded for workflow=$workflow (that matrix leg likely never completed the 'Run the chaos sandbox' step)"
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: chaos-publish
    if: always() && needs.chaos-publish.result != 'skipped' && needs.chaos-publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
